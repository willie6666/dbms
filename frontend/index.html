<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaporAuror — 遊戲商店</title>
    <meta name="description" content="探索海量遊戲，享受最優惠的價格。VaporAuror 是你的終極遊戲平台。">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

    <header id="global-header"></header>

    <main>
        <section class="section store-hero">
            <div class="featured-game">
                <div class="featured-content">
                    <p class="tag is-rounded is-info is-light">VaporAuror Storefront</p>
                    <h1 class="title">探索你的下一款最愛遊戲</h1>
                    <p class="subtitle">超過千款遊戲，總有一款等著你</p>
                    <form class="search-bar field has-addons" id="search-form">
                        <div class="control is-expanded">
                            <input class="input is-medium" type="text" id="search-input" placeholder="搜尋遊戲名稱、類型、開發者...">
                        </div>
                        <div class="control">
                            <button type="submit" class="button is-primary is-medium">搜尋</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>

        <section class="store-layout">
            <aside class="store-sidebar">
                <div class="box sidebar-block">
                    <h2 class="title is-6">分類瀏覽</h2>
                    <ul class="category-list">
                        <li><a href="/pages/store/search.html?q=">所有遊戲</a></li>
                        <li><a href="/pages/store/search.html?q=動作">動作</a></li>
                        <li><a href="/pages/store/search.html?q=角色扮演">角色扮演</a></li>
                        <li><a href="/pages/store/search.html?q=策略">策略</a></li>
                        <li><a href="/pages/store/search.html?q=冒險">冒險</a></li>
                        <li><a href="/pages/store/search.html?q=獨立遊戲">獨立遊戲</a></li>
                    </ul>
                </div>
                <div class="box sidebar-block">
                    <h2 class="title is-6">價格篩選</h2>
                    <ul class="filter-list">
                        <li><a href="/pages/store/search.html?q=免費">免費遊玩</a></li>
                        <li><a href="/pages/store/search.html?q=特賣">特賣中</a></li>
                    </ul>
                </div>
            </aside>
            <div class="store-main">
                <div class="section-header">
                    <h2 class="section-title">熱門推薦</h2>
                    <div class="sort-options">
                        <div class="select is-rounded">
                            <select id="sort-select" class="store-select">
                                <option value="popular">最高人氣</option>
                                <option value="new">最新發行</option>
                                <option value="price_asc">價格由低到高</option>
                                <option value="price_desc">價格由高到低</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="game-list-container" id="game-list">
                    <p class="has-text-centered p-6">載入中...</p>
                </div>
            </div>
        </section>
    </main>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            // 顯示骨架屏
            renderGames(null);
            
            try {
                // GET /api/games — 公開端點，訪客也可取得
                const games = await apiGetGames();
                renderGames(Array.isArray(games) ? games : (games.data || games.games || []));
            } catch (err) {
                document.getElementById('game-list').innerHTML =
                    `<p style="color:var(--accent-red);text-align:center;padding:40px;">無法載入遊戲列表：${err.message}</p>`;
            }
        });
    </script>
</body>
</html>
