<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaporAuror — 遊戲商店</title>
    <meta name="description" content="探索海量遊戲，享受最優惠的價格。VaporAuror 是你的終極遊戲平台。">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

    <header id="global-header"></header>

    <main>
        <div class="search-hero" style="position:relative; overflow:hidden; border-radius:24px; padding:100px 40px; margin-bottom: 60px; text-align:center; background: linear-gradient(135deg, rgba(16, 19, 35, 0.9) 0%, rgba(0,0,0,0.9) 100%); border: 1px solid rgba(0, 240, 255, 0.15); box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 40px rgba(0, 240, 255, 0.05);">
            <div style="position:absolute; top:-50%; left:-50%; width:200%; height:200%; background: radial-gradient(circle at center, rgba(0, 240, 255, 0.1) 0%, transparent 60%); z-index:0; pointer-events:none; animation: pulseGlow 8s infinite alternate;"></div>
            
            <h2 style="position:relative; z-index:1; font-family:'Syne', sans-serif; font-size:4rem; margin-bottom:15px; background: linear-gradient(90deg, #fff, #a5b4fc); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-shadow: 0 0 30px rgba(255,255,255,0.1);">探索你的下一款最愛遊戲</h2>
            <p style="position:relative; z-index:1; font-size:1.2rem; color:var(--text-secondary); margin-bottom:40px; letter-spacing:1px;">超過千款遊戲，總有一款等著你</p>
            
            <form class="search-bar" id="search-form" style="position:relative; z-index:1; max-width:600px; margin:0 auto; display:flex; gap:10px; background: rgba(0,0,0,0.4); padding:8px; border-radius:50px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter:blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
                <input type="text" id="search-input" placeholder="搜尋遊戲名稱、類型、開發者..." style="flex:1; background:transparent; border:none; color:white; padding:15px 25px; font-size:1.1rem; outline:none; font-family:'Outfit', sans-serif;">
                <button type="submit" style="background:var(--accent-cyan); color:#000; border:none; padding:12px 30px; border-radius:40px; font-weight:800; font-size:1.1rem; cursor:pointer; transition:all 0.3s ease; box-shadow:var(--glow-cyan);">搜尋</button>
            </form>
            <style>
                @keyframes pulseGlow { 0% { opacity: 0.5; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.1); } }
                #search-form button:hover { background:white; box-shadow:0 0 20px rgba(255,255,255,0.5); transform:scale(1.05); }
                #search-input::placeholder { color: rgba(255,255,255,0.4); }
                
                /* Cybernetic Aurora Game Cards */
                .game-list-container {
                    display: grid;
                    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
                    gap: 30px;
                    margin-top: 20px;
                }
                
                .game-list-card {
                    background: rgba(16, 19, 35, 0.7);
                    backdrop-filter: blur(10px);
                    border-radius: 16px;
                    overflow: hidden;
                    border: 1px solid var(--border-cyan);
                    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
                    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
                    cursor: pointer;
                    position: relative;
                    display: flex;
                    flex-direction: column;
                }
                
                .game-list-card::before {
                    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                    background: linear-gradient(135deg, rgba(0, 240, 255, 0.1) 0%, transparent 100%);
                    opacity: 0; transition: opacity 0.4s ease; pointer-events: none; z-index: 1;
                }
                
                .game-list-card:hover {
                    transform: translateY(-10px) scale(1.02);
                    border-color: rgba(0, 240, 255, 0.5);
                    box-shadow: 0 20px 40px rgba(0,0,0,0.8), var(--glow-cyan);
                }
                
                .game-list-card:hover::before { opacity: 1; }
                
                .game-thumbnail {
                    width: 100%;
                    aspect-ratio: 16/9;
                    background: #0a0c16;
                    position: relative;
                    overflow: hidden;
                }
                
                .game-thumbnail img {
                    width: 100%; height: 100%; object-fit: cover;
                    transition: transform 0.7s ease;
                }
                
                .game-list-card:hover .game-thumbnail img {
                    transform: scale(1.1);
                }
                
                .game-list-info {
                    padding: 24px;
                    display: flex;
                    flex-direction: column;
                    gap: 12px;
                    flex: 1;
                    position: relative;
                    z-index: 2;
                }
                
                .game-list-title {
                    font-family: 'Syne', sans-serif;
                    font-size: 1.5rem;
                    color: var(--text-primary);
                    font-weight: 700;
                    margin: 0;
                    line-height: 1.2;
                    transition: color 0.3s ease;
                }
                
                .game-list-card:hover .game-list-title { color: var(--accent-cyan); }
                
                .game-list-desc {
                    color: var(--text-secondary);
                    font-size: 0.95rem;
                    line-height: 1.5;
                    display: -webkit-box;
                    -webkit-line-clamp: 2;
                    -webkit-box-orient: vertical;
                    overflow: hidden;
                }
                
                .game-list-tags {
                    display: flex;
                    flex-wrap: wrap;
                    gap: 8px;
                    margin-top: auto;
                }
                
                .tag {
                    background: rgba(255, 255, 255, 0.05);
                    color: var(--text-secondary);
                    padding: 4px 10px;
                    border-radius: 4px;
                    font-size: 12px;
                    border: 1px solid rgba(255, 255, 255, 0.1);
                    transition: all 0.3s ease;
                }
                
                .game-list-card:hover .tag {
                    background: rgba(0, 240, 255, 0.1);
                    border-color: rgba(0, 240, 255, 0.3);
                    color: var(--accent-cyan);
                }
                
                .game-list-price {
                    font-family: 'Space Mono', monospace;
                    font-size: 1.25rem;
                    color: var(--accent-green);
                    font-weight: 700;
                    text-align: right;
                    margin-top: 10px;
                    text-shadow: 0 0 10px rgba(57, 255, 20, 0.2);
                }
                
                .game-list-price.free { color: var(--accent-cyan); text-shadow: var(--glow-cyan); }
            </style>
        </div>

        <h2 class="section-title">熱門推薦</h2>
        <div class="game-list-container" id="game-list">
            <p style="color:var(--text-muted);text-align:center;padding:40px;">載入中...</p>
        </div>
    </main>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            // 顯示骨架屏
            renderGames(null);
            
            try {
                // GET /api/games — 公開端點，訪客也可取得
                const games = await apiGetGames();
                renderGames(Array.isArray(games) ? games : (games.data || games.games || []));
            } catch (err) {
                document.getElementById('game-list').innerHTML =
                    `<p style="color:var(--accent-red);text-align:center;padding:40px;">無法載入遊戲列表：${err.message}</p>`;
            }
        });
    </script>
</body>
</html>
