<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>購買紀錄 — VaporAuror</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        .history-container {
            max-width: 900px;
            margin: 40px auto;
        }
        .history-header {
            border-bottom: 2px solid rgba(0, 240, 255, 0.2);
            padding-bottom: 15px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .history-header h1 {
            color: var(--text-primary);
            font-size: 2rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: var(--glow-cyan);
        }
        .library-item {
            background: rgba(16, 19, 35, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 4px solid var(--accent-cyan);
            border-radius: 12px;
            margin-bottom: 20px;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }
        .library-item:hover {
            border-color: rgba(0, 240, 255, 0.3);
            box-shadow: 0 5px 20px rgba(0, 240, 255, 0.1);
            transform: translateX(5px);
        }
    </style>
</head>
<body>

    <header id="global-header"></header>

    <main class="history-container">
        <div class="history-header">
            <h1 class="section-title" style="margin:0;">📜 購買紀錄與退款</h1>
        </div>
        <div class="library-list" id="history-list">
            <p style="color:var(--text-muted);text-align:center;padding:40px;">載入中...</p>
        </div>
    </main>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            if (!requireLogin()) return;
            await loadHistory();
        });

        async function loadHistory() {
            try {
                // GET /api/transactions
                const result = await apiGetTransactions();
                const list   = Array.isArray(result) ? result : (result.data || result.transactions || []);
                renderHistory(list);
            } catch (err) {
                document.getElementById('history-list').innerHTML =
                    `<p style="color:var(--accent-red);text-align:center;padding:40px;">載入失敗：${err.message}</p>`;
            }
        }

        function renderHistory(transactions) {
            const listEl = document.getElementById('history-list');
            listEl.innerHTML = '';

            if (transactions.length === 0) {
                listEl.innerHTML = `<div class="empty-state"><p>尚無交易紀錄</p></div>`;
                return;
            }

            transactions.forEach(tx => {
                const txItems = tx.Items || tx.items || [];
                const txId    = tx.transaction_id || tx.id;
                const date    = (tx.transaction_date || tx.created_at || '').slice(0, 10);
                
                txItems.forEach(itemInfo => {
                    const item    = document.createElement('div');
                    item.className = 'library-item';

                    const itemId  = itemInfo.item_id || itemInfo.id;
                    const game    = itemInfo.Game || itemInfo.game || {};
                    const title   = game.title || '未知遊戲';
                    const price   = Number(itemInfo.purchase_price || itemInfo.price || 0);
                    const refundStatus = itemInfo.refund_status || itemInfo.refundStatus;
                    const status  = refundStatus === 'APPROVED' ? 'REFUNDED' : (refundStatus || itemInfo.status || tx.status || 'COMPLETED');

                    let statusBadge, actionHtml;

                    if (status === 'COMPLETED') {
                        statusBadge = `<span class="status-badge status-completed">購買成功</span>`;
                        actionHtml  = `<button class="btn-secondary" onclick="requestRefund(${itemId})">申請退款</button>`;
                    } else if (status === 'REFUNDED') {
                        statusBadge = `<span class="status-badge status-refunded">已退款</span>`;
                        actionHtml  = `<span style="color:var(--text-muted);font-size:13px;">退款已處理</span>`;
                    } else if (status === 'PENDING_REFUND' || status === 'PENDING') {
                        statusBadge = `<span class="status-badge status-pending">退款審核中</span>`;
                        actionHtml  = `<span style="color:var(--accent-yellow);font-size:13px;">客服審核中...</span>`;
                    } else {
                        statusBadge = `<span class="status-badge">${status}</span>`;
                        actionHtml  = '';
                    }

                    item.innerHTML = `
                        <div class="library-item-info">
                            <h3 style="color:white; font-size:1.2rem; margin-bottom:8px;">${escapeHtml(title)}</h3>
                            <p style="color:var(--text-secondary);font-size:14px;">
                                訂單：<span style="color:white;font-family:monospace;">#${txId}</span> &nbsp;|&nbsp; 
                                日期：${date} &nbsp;|&nbsp; 
                                金額：<span style="color:var(--accent-pink);font-weight:bold;">NT$ ${price.toLocaleString()}</span> &nbsp;|&nbsp; 
                                ${statusBadge}
                            </p>
                        </div>
                        <div class="library-item-actions">${actionHtml}</div>
                    `;
                    listEl.appendChild(item);
                });
            });
        }

        async function requestRefund(transactionItemId) {
            const reason = prompt("確定要申請退款嗎？\n(注意：遊玩時間超過 2 小時可能無法退款)\n\n請填寫退款理由：");
            if (reason === null) return;
            if (reason.trim() === '') {
                showToast('退款理由不能為空！', 'error');
                return;
            }
            try {
                // POST /api/social/refunds { transaction_item_id, reason }
                await apiRequestRefund(transactionItemId, reason);
                showToast('退款申請已送出，請靜候客服人員處理。', 'success');
                await loadHistory();
            } catch (err) {
                showToast(`申請退款失敗：${err.message}`, 'error');
            }
        }
    </script>
</body>
</html>
