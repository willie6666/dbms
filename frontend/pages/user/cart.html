<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>購物車 — VaporAuror</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        .cart-container {
            max-width: 900px;
            margin: 40px auto;
        }
        .cart-header {
            border-bottom: 2px solid rgba(0, 240, 255, 0.2);
            padding-bottom: 15px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .cart-header h1 {
            color: var(--text-primary);
            font-size: 2rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: var(--glow-cyan);
        }
        .library-item {
            background: rgba(16, 19, 35, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            margin-bottom: 20px;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }
        .library-item:hover {
            border-color: rgba(0, 240, 255, 0.3);
            box-shadow: 0 5px 20px rgba(0, 240, 255, 0.1);
            transform: translateX(5px);
        }
        .cart-summary {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 16px;
            padding: 30px;
            margin-top: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            position: sticky;
            bottom: 20px;
        }
        .cart-total-price {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--accent-cyan);
            font-family: 'Space Mono', monospace;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <header id="global-header"></header>

    <main class="cart-container">
        <div class="cart-header">
            <h1 class="section-title" style="margin:0;">🛒 購物車</h1>
        </div>
        
        <div class="library-list" id="cart-list">
            <p style="color:var(--text-muted);text-align:center;padding:40px;">載入中...</p>
        </div>

        <div class="cart-summary" id="cart-summary" style="display:none;">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;">
                <div>
                    <h3 style="color:var(--text-secondary); text-transform:uppercase; letter-spacing:1px; font-size:14px;">結帳總計</h3>
                    <div class="cart-total-price">NT$ <span id="total-price">0</span></div>
                    <p style="color:var(--accent-green);font-size:13px;margin-top:4px;">💳 錢包餘額：無限</p>
                </div>
                <button class="btn-primary" style="width:200px; height:60px; font-size:18px; box-shadow:var(--glow-cyan);" id="checkout-btn" onclick="checkout()">確認結帳</button>
            </div>
        </div>
    </main>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/main.js"></script>
    <script>
        let cartData = [];

        document.addEventListener("DOMContentLoaded", async () => {
            if (!requireLogin()) return;
            await loadCart();
        });

        async function loadCart() {
            try {
                // GET /api/cart
                const result = await apiGetCart();
                cartData = Array.isArray(result) ? result : (result.data || result.items || result.cart || []);
                renderCart();
            } catch (err) {
                document.getElementById('cart-list').innerHTML =
                    `<p style="color:var(--accent-red);text-align:center;padding:40px;">載入失敗：${err.message}</p>`;
            }
        }

        function renderCart() {
            const listEl    = document.getElementById('cart-list');
            const summaryEl = document.getElementById('cart-summary');
            listEl.innerHTML = '';

            if (cartData.length === 0) {
                listEl.innerHTML = `
                    <div class="empty-state">
                        <p>購物車是空的，去商店挑選遊戲吧！</p>
                        <a href="/" class="btn-secondary" style="display:inline-block;margin-top:12px;">前往商店</a>
                    </div>`;
                summaryEl.style.display = 'none';
                return;
            }

            let total = 0;
            cartData.forEach(item => {
                const game  = item.game || item;
                const gameId = game.id || item.game_id;
                const title  = game.title || item.title || '';
                const price  = Number(game.price || item.price || 0);
                
                // If title is missing, it means the game was deleted from the store
                const displayTitle = title ? title : '🚫 已下架或失效的遊戲';
                
                if (title) {
                    total += price;
                }

                const el = document.createElement('div');
                el.className = 'library-item';
                el.innerHTML = `
                    <div class="library-item-info">
                        <h3 style="color:${title ? 'white' : 'var(--accent-red)'}; font-size:1.2rem; margin-bottom:8px;">${escapeHtml(displayTitle)}</h3>
                        <p style="color:var(--accent-pink);font-size:16px;font-weight:700;">NT$ ${price.toLocaleString()}</p>
                    </div>
                    <div class="library-item-actions">
                        <button class="btn-secondary" style="border-color:rgba(255,0,85,0.3); color:var(--accent-pink);" onclick="removeFromCart(${gameId})">移除</button>
                    </div>
                `;
                listEl.appendChild(el);
            });

            document.getElementById('total-price').textContent = total.toLocaleString();
            summaryEl.style.display = 'block';
        }

        async function removeFromCart(gameId) {
            try {
                // DELETE /api/protected/cart/{game_id}
                await apiRemoveFromCart(gameId);
                showToast('移除成功！', 'success');
                await loadCart();
            } catch (err) {
                showToast(`移除失敗：${err.message}`, 'error');
            }
        }

        async function checkout() {
            const btn = document.getElementById('checkout-btn');
            btn.disabled = true;
            btn.textContent = '處理中...';
            try {
                // POST /api/protected/checkout
                await apiCheckout();
                showToast('結帳成功！遊戲已加入你的個人遊戲庫。', 'success');
                cartData = [];
                renderCart();
            } catch (err) {
                showToast(`結帳失敗：${err.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '確認結帳';
            }
        }
    </script>
</body>
</html>
