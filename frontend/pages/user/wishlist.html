<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>願望清單 — VaporAuror</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        .wishlist-container {
            max-width: 900px;
            margin: 40px auto;
        }
        .wishlist-header {
            border-bottom: 2px solid rgba(0, 240, 255, 0.2);
            padding-bottom: 15px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .wishlist-header h1 {
            color: var(--text-primary);
            font-size: 2rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: var(--glow-cyan);
        }
        .library-item {
            background: rgba(16, 19, 35, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 4px solid var(--accent-pink);
            border-radius: 12px;
            margin-bottom: 20px;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }
        .library-item:hover {
            border-color: rgba(255, 0, 85, 0.3);
            box-shadow: 0 5px 20px rgba(255, 0, 85, 0.1);
            transform: translateX(5px);
        }
    </style>
</head>
<body>

    <header id="global-header"></header>

    <main class="wishlist-container">
        <div class="wishlist-header">
            <h1 class="section-title" style="margin:0;">✨ 願望清單</h1>
        </div>
        <div class="library-list" id="wishlist-container">
            <p style="color:var(--text-muted);text-align:center;padding:40px;">載入中...</p>
        </div>
    </main>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            if (!requireLogin()) return;
            await loadWishlist();
        });

        async function loadWishlist() {
            try {
                // GET /api/wishlist
                const result = await apiGetWishlist();
                const games  = Array.isArray(result) ? result : (result.data || result.games || []);
                renderWishlist(games);
            } catch (err) {
                document.getElementById('wishlist-container').innerHTML =
                    `<p style="color:var(--accent-red);text-align:center;padding:40px;">載入失敗：${err.message}</p>`;
            }
        }

        function renderWishlist(games) {
            const listEl = document.getElementById('wishlist-container');
            listEl.innerHTML = '';

            if (games.length === 0) {
                listEl.innerHTML = `
                    <div class="empty-state">
                        <p>願望清單空空如也，去商店尋找心儀的遊戲吧！</p>
                        <a href="/" class="btn-primary" style="display:inline-block;width:auto;padding:10px 24px;margin-top:12px;">前往商店</a>
                    </div>`;
                return;
            }

            games.forEach(item => {
                const game    = item.game || item;
                const gameId  = game.id   || item.game_id;
                const title   = game.title || item.title || '';
                const price   = Number(game.price || item.price || 0);
                const releaseDate = game.release_date || game.releaseDate || item.release_date || '未定';

                const el = document.createElement('div');
                el.className = 'library-item';
                el.innerHTML = `
                    <div class="library-item-info">
                        <h3 style="color:white; font-size:1.3rem; margin-bottom:8px;">${escapeHtml(title)}</h3>
                        <p style="color:var(--text-secondary);font-size:14px;">
                            定價：<strong style="color:var(--accent-cyan);font-size:1.1rem;">NT$ ${price.toLocaleString()}</strong> &nbsp;|&nbsp; 
                            發售日：${releaseDate}
                        </p>
                    </div>
                    <div class="library-item-actions">
                        <button class="btn-primary" style="width:auto;padding:8px 18px;margin-top:0;box-shadow:var(--glow-cyan);"
                                onclick="moveToCart(${gameId})">加入購物車</button>
                        <button class="btn-secondary" style="border-color:rgba(255,255,255,0.2);" onclick="removeWishlist(${gameId})">移除</button>
                    </div>
                `;
                listEl.appendChild(el);
            });
        }

        async function removeWishlist(gameId) {
            try {
                // DELETE /api/protected/wishlist/{game_id}
                await apiRemoveWishlist(gameId);
                showToast('已從願望清單移除！', 'success');
                await loadWishlist();
            } catch (err) {
                showToast(`移除失敗：${err.message}`, 'error');
            }
        }

        async function moveToCart(gameId) {
            try {
                // POST /api/protected/cart + DELETE /api/protected/wishlist/{game_id}
                await apiAddToCart(gameId);
                await apiRemoveWishlist(gameId);
                showToast('已將遊戲移至購物車！', 'success');
                await loadWishlist();
            } catch (err) {
                showToast(`操作失敗：${err.message}`, 'error');
            }
        }
    </script>
</body>
</html>
