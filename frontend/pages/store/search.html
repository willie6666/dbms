<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜尋結果 — VaporAuror</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

    <header id="global-header"></header>

    <main>
        <section class="section store-hero" style="margin-bottom: 30px; padding: 40px;">
            <form class="search-bar field has-addons" id="search-form">
                <div class="control is-expanded">
                    <input class="input is-medium" type="text" id="search-input" placeholder="搜尋遊戲名稱、類型、開發者...">
                </div>
                <div class="control">
                    <button type="submit" class="button is-primary is-medium">搜尋</button>
                </div>
            </form>
        </section>

        <div class="notification is-info is-light search-results-header" id="search-results-header"></div>
        <h1 class="title section-title" id="search-section-title">搜尋結果</h1>
        <div class="game-list-container" id="game-list">
            <p class="has-text-centered p-6">載入中...</p>
        </div>
    </main>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const params  = new URLSearchParams(window.location.search);
            const keyword = params.get('q') || '';
            const tag = params.get('tag') || '';

            document.getElementById('search-input').value = keyword;
            
            if (keyword) {
                document.title = `"${keyword}" 的搜尋結果 — VaporAuror`;
            } else if (tag) {
                document.title = `標籤「${tag}」的遊戲 — VaporAuror`;
            } else {
                document.title = '搜尋遊戲 — VaporAuror';
                document.getElementById('search-section-title').textContent = '瀏覽所有遊戲';
                document.getElementById('search-results-header').innerHTML = '';
            }

            // 顯示骨架屏
            renderGames(null);

            try {
                // GET /api/games?q=keyword&tag=tag — 公開端點
                const result = await apiGetGames(keyword, tag);
                const games  = Array.isArray(result) ? result : (result.data || result.games || []);

                const headerEl = document.getElementById('search-results-header');
                if (keyword) {
                    headerEl.innerHTML = `找到 <strong>${games.length}</strong> 個符合「<strong>${escapeHtml(keyword)}</strong>」的結果`;
                    document.getElementById('search-section-title').textContent = `搜尋結果 (${games.length})`;
                } else if (tag) {
                    headerEl.innerHTML = `找到 <strong>${games.length}</strong> 個符合標籤「<strong>${escapeHtml(tag)}</strong>」的結果`;
                    document.getElementById('search-section-title').textContent = `分類瀏覽 (${games.length})`;
                }

                renderGames(games);
            } catch (err) {
                document.getElementById('game-list').innerHTML =
                    `<p style="color:var(--accent-red);text-align:center;padding:40px;">搜尋失敗：${err.message}</p>`;
            }
        });
    </script>
</body>
</html>
