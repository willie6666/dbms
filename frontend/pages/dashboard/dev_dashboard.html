<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>開發者中心 — VaporAuror</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        /* Cyber Aurora Dashboard Styles */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            margin-top: 30px;
        }

        .dashboard-panel {
            background: rgba(16, 19, 35, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            height: fit-content;
        }

        .dashboard-panel h2 {
            color: var(--text-primary);
            margin-bottom: 25px;
            font-size: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dashboard-panel h2::before {
            content: '';
            display: block;
            width: 4px;
            height: 20px;
            background: var(--accent-cyan);
            border-radius: 2px;
            box-shadow: var(--glow-cyan);
        }

        .stat-card {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            transition: transform 0.3s, border-color 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 240, 255, 0.3);
            box-shadow: 0 10px 20px rgba(0, 240, 255, 0.1);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            margin-top: 15px;
            font-family: 'Space Mono', monospace;
            text-shadow: 0 0 20px currentColor;
        }

        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        /* Form Styles */
        .dev-form .form-group label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .dev-form input, .dev-form textarea {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            transition: all 0.3s;
            border-radius: 8px;
            padding: 12px 15px;
        }

        .dev-form input:focus, .dev-form textarea:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
            outline: none;
        }

        /* Library List Overrides */
        .library-item {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 15px;
            transition: all 0.3s;
            border-radius: 12px;
        }
        .library-item:hover {
            background: rgba(0, 240, 255, 0.05);
            border-color: rgba(0, 240, 255, 0.2);
            transform: scale(1.01);
        }

        .media-upload-area {
            margin-top: 15px;
            padding: 15px;
            background: rgba(0,0,0,0.5);
            border-radius: 8px;
            border: 1px dashed rgba(255,255,255,0.2);
            display: none;
        }
        .media-upload-area.active { display: block; }
    </style>
</head>
<body>

    <header id="global-header"></header>

    <main>
        <div class="dashboard-header">
            <h1>開發者中心</h1>
            <span class="role-badge dev">DEVELOPER</span>
        </div>

        <div class="dashboard-stats" id="sales-stats">
            <p style="color:var(--text-muted);">載入中...</p>
        </div>

        <div class="dashboard-grid">
            <!-- 上架新遊戲面板 -->
            <div class="dashboard-panel">
                <h2>發行新遊戲</h2>
                <form id="upload-game-form" class="dev-form">
                    <div class="form-group">
                        <label for="new-game-title">遊戲名稱</label>
                        <input type="text" id="new-game-title" placeholder="輸入炫酷的標題" required>
                    </div>
                    <div class="form-group">
                        <label for="new-game-price">定價 (NT$)</label>
                        <input type="number" id="new-game-price" min="0" placeholder="0 表示免費" required>
                    </div>
                    <div class="form-group">
                        <label for="new-game-desc">遊戲介紹</label>
                        <textarea id="new-game-desc" placeholder="簡短描述你的遊戲亮點..." required style="min-height: 120px;"></textarea>
                    </div>
                    <button type="submit" class="btn-primary" id="publish-btn" style="width: 100%; box-shadow: var(--glow-cyan);">
                        🚀 立即上架
                    </button>
                </form>
            </div>

            <!-- 管理遊戲面板 -->
            <div class="dashboard-panel">
                <h2>管理我的遊戲</h2>
                <div class="library-list" id="my-published-games">
                    <p style="color:var(--text-muted);">載入中...</p>
                </div>
            </div>
        </div>
    </main>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const role = getCurrentRole();
            if (role !== 'DEVELOPER' && role !== 'ADMIN') {
                alert("存取被拒：您沒有開發者權限");
                window.location.href = '/';
                return;
            }
            await loadDashboard();
        });

        async function loadDashboard() {
            try {
                const result = await apiGetDeveloperGames();
                let myGames  = Array.isArray(result) ? result : (result.data || result.games || []);

                // 統計卡片（若後端有 stats 端點則逐一呼叫，否則從遊戲列表加總）
                let totalRevenue = 0;
                let totalSales   = 0;
                const statsPromises = myGames.map(async g => {
                    try {
                        const gameId = g.game_id || g.id;
                        const stats = await apiGetGameStats(gameId);
                        totalRevenue += Number(stats.revenue || stats.total_revenue || 0);
                        totalSales   += Number(stats.sales   || stats.total_sales   || 0);
                    } catch (_) {}
                });
                await Promise.all(statsPromises);

                const activeCount = myGames.filter(g => !g.deleted_at && g.status !== 'TAKEN_DOWN').length;

                document.getElementById('sales-stats').innerHTML = `
                    <div class="stat-card">
                        <h3>總營收 (NT$)</h3>
                        <div class="stat-value" style="color:var(--accent-green);">$${totalRevenue.toLocaleString()}</div>
                    </div>
                    <div class="stat-card">
                        <h3>累積銷量（套）</h3>
                        <div class="stat-value">${totalSales.toLocaleString()}</div>
                    </div>
                    <div class="stat-card">
                        <h3>上架中遊戲</h3>
                        <div class="stat-value" style="color:var(--accent-blue);">${activeCount}</div>
                    </div>
                `;

                renderMyGames(myGames);
            } catch (err) {
                document.getElementById('sales-stats').innerHTML =
                    `<p style="color:var(--accent-red);">載入失敗：${err.message}</p>`;
            }
        }

        function renderMyGames(games) {
            const listEl = document.getElementById('my-published-games');
            listEl.innerHTML = '';

            if (games.length === 0) {
                listEl.innerHTML = `<div class="empty-state"><p>尚未上架任何遊戲</p></div>`;
                return;
            }

            games.forEach(game => {
                const gameId = game.game_id || game.id;
                const item     = document.createElement('div');
                item.className = 'library-item';

                const isActive   = !game.deleted_at && game.status !== 'TAKEN_DOWN';
                const statusBadge = isActive
                    ? `<span class="status-badge status-active">上架中</span>`
                    : `<span class="status-badge status-taken-down">已下架</span>`;
                const actionBtn = isActive
                    ? `<button class="btn-primary" style="margin:0 5px; padding:6px 12px; font-size:12px; width:auto;" onclick="toggleMediaUpload(${gameId})">素材管理</button>
                       <button class="btn-secondary" style="margin:0; padding:6px 12px; font-size:12px; width:auto; color:var(--accent-pink); border-color:rgba(255,0,85,0.3);" onclick="takeDownGame(${gameId})">下架</button>`
                    : `<span style="color:var(--text-muted);font-size:13px;">已停止販售</span>`;

                item.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div class="library-item-info">
                            <h3 style="color:var(--accent-cyan);">${escapeHtml(game.title)}</h3>
                            <p style="color:var(--text-secondary); margin-top:5px;">定價：NT$ ${Number(game.price).toLocaleString()} &nbsp;|&nbsp; ${statusBadge}</p>
                        </div>
                        <div class="library-item-actions" style="display:flex;">${actionBtn}</div>
                    </div>
                    <div id="media-upload-${gameId}" class="media-upload-area dev-form">
                        <h4 style="color:white; margin-bottom:10px; font-size:14px;">上傳展示圖片或遊戲檔 (路徑)</h4>
                        <div style="display:flex; gap:10px;">
                            <select id="media-type-${gameId}" style="background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.2); color:white; border-radius:4px; padding:5px 10px;">
                                <option value="media">遊戲圖片</option>
                                <option value="game_file">遊戲執行檔</option>
                            </select>
                            <input type="text" id="media-url-${gameId}" placeholder="如：/media/images/cover.jpg" style="flex:1;">
                            <button class="btn-primary" style="margin:0; width:auto; padding:8px 15px;" onclick="uploadMedia(${gameId})">新增</button>
                        </div>
                        <p style="font-size:12px; color:var(--text-muted); margin-top:8px;">* 圖片將顯示於商店頁面輪播圖中。</p>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        document.getElementById('upload-game-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title  = document.getElementById('new-game-title').value.trim();
            const price  = parseInt(document.getElementById('new-game-price').value) || 0;
            const desc   = document.getElementById('new-game-desc').value.trim();
            const btn    = document.getElementById('publish-btn');

            btn.disabled = true;
            btn.textContent = '上架中...';

            try {
                // POST /api/games
                await apiCreateGame(title, price, desc);
                alert(`《${title}》上架成功！`);
                document.getElementById('upload-game-form').reset();
                await loadDashboard();
            } catch (err) {
                alert(`上架失敗：${err.message}`);
            } finally {
                btn.disabled = false;
                btn.textContent = '確認上架';
            }
        });

        function toggleMediaUpload(gameId) {
            document.getElementById(`media-upload-${gameId}`).classList.toggle('active');
        }

        async function uploadMedia(gameId) {
            const urlInput = document.getElementById(`media-url-${gameId}`);
            const typeInput = document.getElementById(`media-type-${gameId}`);
            const file_url = urlInput.value.trim();
            const media_type = typeInput.value;

            if (!file_url) return;

            try {
                // api.js doesn't have apiUploadMedia yet, so doing fetch manually or using authFetch
                const res = await authFetch(`/api/developer/games/${gameId}/media`, {
                    method: 'POST',
                    body: JSON.stringify({ file_url, media_type })
                });
                const data = await parseResponse(res);
                alert('素材上傳成功！');
                urlInput.value = '';
            } catch (err) {
                alert(`上傳失敗：${err.message}`);
            }
        }

        async function takeDownGame(gameId) {
            if (!confirm("確定要下架此遊戲嗎？\n已購買的玩家仍可遊玩，但商店頁面將隱藏。")) return;
            try {
                // DELETE /api/developer/games/{id}
                await apiDeleteGame(gameId);
                alert('遊戲已下架！');
                await loadDashboard();
            } catch (err) {
                alert(`下架失敗：${err.message}`);
            }
        }
    </script>
</body>
</html>
