<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理員後台 — VaporAuror</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            margin-top: 30px;
        }
        .dashboard-panel {
            background: rgba(16, 19, 35, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            height: fit-content;
        }
        .dashboard-panel h2 {
            color: var(--accent-pink);
            margin-bottom: 25px;
            font-size: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .dashboard-panel h2::before {
            content: ''; display: block; width: 4px; height: 20px;
            background: var(--accent-pink); border-radius: 2px;
            box-shadow: 0 0 10px var(--accent-pink);
        }
        .library-item {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 15px;
            transition: all 0.3s;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .library-item:hover {
            background: rgba(255, 0, 85, 0.05);
            border-color: rgba(255, 0, 85, 0.2);
            transform: scale(1.01);
        }
        .role-select {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
        }
        .role-select:focus {
            border-color: var(--accent-cyan);
        }
    </style>
</head>
<body>

    <header id="global-header"></header>

    <main>
        <div class="dashboard-header">
            <h1>系統管理員後台</h1>
            <span class="role-badge admin">ADMIN</span>
        </div>

        <div class="dashboard-grid">
            <div class="dashboard-panel">
                <h2>全站帳號與權限管理</h2>
                <div class="library-list" id="users-list">
                    <p style="color:var(--text-muted);">載入中...</p>
                </div>
            </div>

            <div class="dashboard-panel">
                <h2>商店遊戲管理（強制下架）</h2>
                <div class="library-list" id="admin-games-list">
                    <p style="color:var(--text-muted);">載入中...</p>
                </div>
            </div>
        </div>
    </main>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            if (getCurrentRole() !== 'ADMIN') {
                alert("存取被拒：您沒有管理員權限");
                window.location.href = '/';
                return;
            }
            await Promise.all([loadUsers(), loadGames()]);
        });

        // ─── 帳號列表 ──────────────────────────────────────────
        async function loadUsers() {
            try {
                // GET /api/admin/users
                const result = await apiGetUsers();
                const users  = Array.isArray(result) ? result : (result.data || result.users || []);
                renderUsers(users);
            } catch (err) {
                document.getElementById('users-list').innerHTML =
                    `<p style="color:var(--accent-red);">載入失敗：${err.message}</p>`;
            }
        }

        function renderUsers(users) {
            const list = document.getElementById('users-list');
            list.innerHTML = '';

            if (users.length === 0) {
                list.innerHTML = `<div class="empty-state"><p>暫無使用者資料</p></div>`;
                return;
            }

            users.forEach(user => {
                const item = document.createElement('div');
                item.className = 'library-item';

                const isBanned     = user.permission === 'DEACTIVE';
                const statusBadge  = !isBanned
                    ? `<span class="status-badge status-active">正常</span>`
                    : `<span class="status-badge status-banned">已停權</span>`;
                const banText      = !isBanned ? "停權" : "解除停權";
                const banColor     = !isBanned ? "var(--accent-red)" : "var(--accent-yellow)";

                item.innerHTML = `
                    <div class="library-item-info">
                        <h3>ID: ${user.id} — ${escapeHtml(user.username)}</h3>
                        <p>信箱：${escapeHtml(user.email || '')} &nbsp;|&nbsp; 狀態：${statusBadge}</p>
                    </div>
                    <div class="library-item-actions">
                        <select class="role-select" onchange="changeRole(${user.id}, this.value)">
                            <option value="USERS"     ${user.role==='USERS'     ? 'selected':''}>玩家 (User)</option>
                            <option value="DEVELOPER" ${user.role==='DEVELOPER' ? 'selected':''}>開發者 (Dev)</option>
                            <option value="CSR"       ${user.role==='CSR'       ? 'selected':''}>客服 (CSR)</option>
                            <option value="ADMIN"     ${user.role==='ADMIN'     ? 'selected':''}>管理員 (Admin)</option>
                        </select>
                        <button class="btn-secondary"
                                style="background-color:${banColor};color:#fff;border-color:${banColor};"
                                onclick="toggleSuspend(${user.id}, ${isBanned})">${banText}</button>
                        <button class="btn-secondary" onclick="deleteUser(${user.id})">永久刪除</button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        async function changeRole(userId, newRole) {
            if (!confirm(`確定要將此帳號的權限更改為 [${newRole}] 嗎？`)) {
                await loadUsers(); // 取消時還原 select
                return;
            }
            try {
                // PUT /api/admin/users/{id}/role  { role }
                await apiChangeRole(userId, newRole);
                alert('權限變更成功！');
                await loadUsers();
            } catch (err) {
                alert(`變更失敗：${err.message}`);
                await loadUsers();
            }
        }

        async function toggleSuspend(userId, currentlySuspended) {
            const action = currentlySuspended ? '解除停權' : '停權';
            if (!confirm(`確定要對此帳號執行「${action}」嗎？`)) return;
            try {
                // PUT /api/admin/users/{id}/suspend
                await apiSuspendUser(userId);
                alert(`${action}成功！`);
                await loadUsers();
            } catch (err) {
                alert(`操作失敗：${err.message}`);
            }
        }

        async function deleteUser(userId) {
            if (!confirm("警告：此操作不可逆！確定要永久刪除此帳號嗎？")) return;
            try {
                // DELETE /api/admin/users/{id}
                await apiDeleteUser(userId);
                alert('帳號已永久移除。');
                await loadUsers();
            } catch (err) {
                alert(`刪除失敗：${err.message}`);
            }
        }

        // ─── 遊戲管理 ──────────────────────────────────────────
        async function loadGames() {
            try {
                // GET /api/games
                const result = await apiGetGames();
                const games  = Array.isArray(result) ? result : (result.data || result.games || []);
                renderGamesForAdmin(games);
            } catch (err) {
                document.getElementById('admin-games-list').innerHTML =
                    `<p style="color:var(--accent-red);">載入失敗：${err.message}</p>`;
            }
        }

        function renderGamesForAdmin(games) {
            const list = document.getElementById('admin-games-list');
            list.innerHTML = '';

            games.forEach(game => {
                const gameId = game.game_id || game.id;
                const item = document.createElement('div');
                item.className = 'library-item';
                const developer = game.developer || (game.developer_user && game.developer_user.username) || '未知';

                item.innerHTML = `
                    <div class="library-item-info">
                        <h3>${escapeHtml(game.title)}</h3>
                        <p>開發者：${escapeHtml(developer)} &nbsp;|&nbsp;
                           <span class="status-badge status-active">正常販售中</span>
                        </p>
                    </div>
                    <div class="library-item-actions">
                        <button class="btn-danger" onclick="adminTakeDown(${gameId})">強制下架</button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        async function adminTakeDown(gameId) {
            if (!confirm("確定要以管理員身分強制下架此遊戲嗎？")) return;
            try {
                // DELETE /api/admin/games/{id}
                await apiAdminDeleteGame(gameId);
                alert('遊戲已強制下架！');
                await loadGames();
            } catch (err) {
                alert(`下架失敗：${err.message}`);
            }
        }
    </script>
</body>
</html>
