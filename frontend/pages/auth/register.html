<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>註冊帳號 — VaporAuror</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

    <header id="global-header"></header>

    <main>
        <div class="auth-container" style="max-width:460px;">
            <h2>建立帳號</h2>
            <p class="auth-subtitle">加入 VaporAuror，開始你的遊戲旅程</p>

            <div id="register-error" class="alert-info" style="display:none;background:rgba(255,89,89,0.1);border-color:rgba(255,89,89,0.3);color:#ff5959;"></div>

            <form id="register-form">
                <div class="form-group">
                    <label for="reg-username">使用者名稱 (Username)</label>
                    <input type="text" id="reg-username" placeholder="4~20 個字元" minlength="4" maxlength="20" required>
                </div>
                <div class="form-group">
                    <label for="reg-email">電子郵件 (Email)</label>
                    <input type="email" id="reg-email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">密碼 (Password)</label>
                    <input type="password" id="reg-password" placeholder="至少 8 個字元" minlength="8" required>
                </div>
                <div class="form-group">
                    <label for="reg-confirm">確認密碼</label>
                    <input type="password" id="reg-confirm" placeholder="再次輸入密碼" required>
                </div>
                <button type="submit" class="btn-primary" id="register-btn">建立帳號</button>
            </form>

            <div class="form-divider">或</div>

            <p style="text-align:center; font-size:14px; color:var(--text-muted);">
                已經有帳號了？
                <a href="/pages/auth/login.html" style="color:var(--accent-blue); font-weight:600;">直接登入</a>
            </p>
        </div>
    </main>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/main.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('reg-username').value.trim();
            const email    = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const confirm  = document.getElementById('reg-confirm').value;
            const errorEl  = document.getElementById('register-error');
            const btn      = document.getElementById('register-btn');

            // 前端驗證
            if (password !== confirm) {
                errorEl.textContent = '兩次輸入的密碼不一致，請重新確認。';
                errorEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = '建立中...';
            errorEl.style.display = 'none';

            try {
                const data = await apiRegister(username, email, password);
                // 後端回傳 { token, user }
                saveAuthState(data);
                window.location.href = '/';
            } catch (err) {
                errorEl.textContent = err.message || '註冊失敗，請稍後再試。';
                errorEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = '建立帳號';
            }
        });
    </script>
</body>
</html>
